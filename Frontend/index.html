<!DOCTYPE html>
<html>

<head>

    <title>NetRouteX Simulator</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="topbar">

        <h1>🌐 NetRouteX Simulator</h1>

        <p id="clock"></p>

    </div>

    <div class="container">

        <div class="sidebar">

            <h2>Controls</h2>

            <button onclick="runSimulation()">
                ▶ Run Simulation
            </button>

            <button onclick="disableRouter()">
    ❌ Disable R5
</button>

<button onclick="enableRouter()">
    ✅ Enable R5
</button>

<button onclick="disableRouter6()">
    ❌ Disable R6
</button>

            <div class="status-panel">

                <h3>Router Status</h3>

                <p id="status-r5">
                    R5 : ACTIVE
                </p>

                <p id="packetCount">
                    Packets Sent : 0
                </p>

            </div>

        </div>

        <div class="network">

            <div class="link l1"></div>
<div class="link l2"></div>
<div class="link l3"></div>
<div class="link l4"></div>
<div class="link l5"></div>
<div class="link l6"></div>
<div class="link l7"></div>
<div class="link l8"></div>
<div class="link l9b"></div>
<div class="link l9"></div>
<div class="link l10"></div>
<div class="link l11"></div>
<div class="link l12"></div>
<div class="link l13"></div>
<div class="link l14"></div>
            <div class="node host" id="h1">
                H1
            </div>

            <div class="node router" id="r1">
                R1
            </div>

            <div class="node router" id="r2">
                R2
            </div>

            <div class="node router" id="r3">
                R3
            </div>

            <div class="node router" id="r4">
                R4
            </div>

            <div class="node router" id="r5">
                R5
            </div>
            <div class="node router" id="r6">R6</div>
            <div class="node router" id="r7">R7</div>
            <div class="node router" id="r8">R8</div>
            <div class="node router" id="r9">R9</div>
            <div class="node router" id="r10">R10</div>
            <div class="node router" id="r11">R11</div>
            <div class="node router" id="r12">R12</div>
            <div class="node host" id="h2">
                H2
            </div>

            <div id="packet"></div>

        </div>

    </div>

    <div class="logs">

        <h3>📜 Simulation Logs</h3>

        <pre id="output">
Waiting...
        </pre>

    </div>

    <script src="script.js"></script>

</body>

</html>
